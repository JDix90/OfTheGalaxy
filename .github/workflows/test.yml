name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Run database migrations
        run: |
          cd backend
          npm run migrate
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/test_db
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          # config/database.js (test) reads these; align them with the postgres service.
          DB_USER: postgres
          DB_PASSWORD: test
          DB_NAME_TEST: test_db
          DB_HOST: localhost
          DB_PORT: 5432
      
      - name: Run backend tests
        run: |
          cd backend
          npm test -- --coverage
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/test_db
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          # config/database.js (test) reads these; align them with the postgres service.
          DB_USER: postgres
          DB_PASSWORD: test
          DB_NAME_TEST: test_db
          DB_HOST: localhost
          DB_PORT: 5432
      
      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --coverage
      
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

